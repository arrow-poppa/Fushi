name: Linux x64 artifact (unsigned)

# 手动产出一个**可下载的** Linux x64 release bundle，不发布任何东西。
#
# 为什么单独开一条而不是复用现有的：
#
# * `release-desktop.yml` 只有 windows / macos / ios / kazumi-adhoc 四个构建 job，
#   **没有 Linux**——五平台构建计划里签名发布按用户决策暂不做，Linux 只做免费编译
#   验证（docs/specs/2026-05-30-five-platform-build.md）。
# * `build-multiplatform.yml` 的 linux job 确实构建本体，但它 (a) 只构建 `--debug`，
#   (b) 只上传 `fushi_server-linux-x64`（无头服务端），app 的 bundle 随 runner 一起
#   丢掉。给它加一份 release 构建 + 上传，等于给每条 PR 都挂上一次额外的全量构建，
#   而那条 workflow 已经是四平台里最长的一条。
#
# 所以这条的定位很窄：只出 Linux x64、只上传 artifact、绝不发布。
#
# **产物能力受限**（不是本 workflow 的问题，是平台现状）：`flutter_inappwebview`
# 没有 Linux 后端，EPUB 阅读器在 Linux 返回「暂不支持」占位
# （reader_fushi/webview.part.dart），字典 popup 同样是 InAppWebView 且**没有**对应
# 守卫。CI 至今只验证过 Linux **能编译**，没有验证过它**能跑**。
#
# 运行时依赖（目标机需自备）：GTK 3、libmpv、keybinder-3.0。

# 触发方式两条，与 android-arm64-artifact.yml 同构：
#
# * `workflow_dispatch` —— 文件进了默认分支之后的常规入口。
# * 给 PR 打 `build-linux` 标签 —— 在文件还没进默认分支时唯一可用的入口
#   （GitHub 要求 workflow_dispatch 的定义位于默认分支）。用 `types: [labeled]`
#   而不是裸 `pull_request`，是为了不给每一条无关 PR 都挂上一次 Linux 全量构建。
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.label.name == 'build-linux'
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v6

      # 与 build-multiplatform.yml 的 linux job 同一份依赖列表。ubuntu-latest 自带的
      # clang 编不了这棵树：fushidicts 要 C++23 的 std::expected。
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build clang cmake pkg-config patchelf \
            gcc-14 g++-14 libstdc++-14-dev \
            libgtk-3-dev libkeybinder-3.0-dev libmpv-dev liblzma-dev

      - name: Verify Linux C++23 compiler
        shell: bash
        run: |
          set -euo pipefail
          "$CC" --version
          "$CXX" --version
          cat > /tmp/fushidicts_expected.cpp <<'CPP'
          #include <expected>
          #ifndef __cpp_lib_expected
          #error __cpp_lib_expected missing
          #endif
          int main() {
            std::expected<int, int> ok = 23;
            std::expected<int, int> fail = std::unexpected(1);
            return ok.value() == 23 && fail.error() == 1 ? 0 : 1;
          }
          CPP
          "$CXX" -std=c++23 /tmp/fushidicts_expected.cpp -o /tmp/fushidicts_expected

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable

      # 烘进包里的密钥走同一个 composite action（BUG-1588：逐字抄进各 job 会漂）。
      - name: Provide baked-in secret stubs
        uses: ./.github/actions/provide-baked-secrets
        with:
          google-oauth-client-secret: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          log-upload-endpoint: ${{ secrets.LOG_UPLOAD_ENDPOINT }}
          log-upload-token: ${{ secrets.LOG_UPLOAD_TOKEN }}
          dandanplay-app-id: ${{ secrets.DANDANPLAY_APP_ID }}
          dandanplay-app-secret: ${{ secrets.DANDANPLAY_APP_SECRET }}
          tmdb-api-key: ${{ secrets.TMDB_API_KEY }}
          opensubtitles-api-key: ${{ secrets.OPENSUBTITLES_API_KEY }}

      - name: Flutter pub get
        working-directory: fushi
        run: flutter pub get

      - name: Apply pub cache patches
        run: |
          chmod +x ci/apply-patches.sh
          bash ci/apply-patches.sh

      # Flutter 3.44 给 Linux CMake 硬编 CC=clang / CXX=clang++，**无视** job 级的
      # CC/CXX。把 wrapper 放进 PATH 最前面，让 configure 和真正的构建都用上面验证过
      # 的 GNU 14。逐字同 build-multiplatform.yml 的 linux job，只是配的是 release。
      - name: Flutter Linux CMake toolchain shim
        working-directory: fushi
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/linux
          mkdir -p "$RUNNER_TEMP/fushi-linux-toolchain"
          cat > "$RUNNER_TEMP/fushi-linux-toolchain/clang" <<'SH'
          #!/usr/bin/env bash
          exec gcc-14 "$@"
          SH
          cat > "$RUNNER_TEMP/fushi-linux-toolchain/clang++" <<'SH'
          #!/usr/bin/env bash
          exec g++-14 "$@"
          SH
          chmod +x "$RUNNER_TEMP/fushi-linux-toolchain/clang" \
            "$RUNNER_TEMP/fushi-linux-toolchain/clang++"

          PATH="$RUNNER_TEMP/fushi-linux-toolchain:$PATH" \
            flutter build linux --release --config-only

          cache="build/linux/x64/release/CMakeCache.txt"
          grep -F "CMAKE_CXX_COMPILER:FILEPATH=$RUNNER_TEMP/fushi-linux-toolchain/clang++" "$cache"
          compiler_file="$(find build/linux/x64/release/CMakeFiles -name CMakeCXXCompiler.cmake -print -quit)"
          test -n "$compiler_file"
          grep -F 'set(CMAKE_CXX_COMPILER_ID "GNU")' "$compiler_file"

      # CI 至今只构建过 `--debug`（build-multiplatform.yml）。release 多了 Dart AOT 与
      # `-O3`/LTO 级别的差异，所以失败诊断照抄 debug 那条的形状，别让构建挂在一句
      # 「ninja: build stopped」上。
      - name: Build Linux (release)
        working-directory: fushi
        shell: bash
        run: |
          set -euo pipefail
          if PATH="$RUNNER_TEMP/fushi-linux-toolchain:$PATH" \
              flutter build linux --release --verbose; then
            exit 0
          fi

          echo "::group::Linux CMake/Ninja diagnostics"
          cache="build/linux/x64/release/CMakeCache.txt"
          if [ -f "$cache" ]; then
            grep -E 'CMAKE_(C|CXX)_COMPILER|CMAKE_CXX_STANDARD|CMAKE_BUILD_TYPE' "$cache" || true
          fi
          compiler_file="$(
            find build/linux/x64/release/CMakeFiles \
              -name CMakeCXXCompiler.cmake -print -quit 2>/dev/null || true
          )"
          if [ -n "$compiler_file" ]; then
            grep -E 'CMAKE_CXX_COMPILER(_ID|_VERSION)?|CMAKE_CXX_STANDARD' \
              "$compiler_file" || true
          fi
          if [ -d build/linux/x64/release ]; then
            PATH="$RUNNER_TEMP/fushi-linux-toolchain:$PATH" \
              ninja -C build/linux/x64/release -v install || true
          fi
          echo "::endgroup::"
          exit 1

      # flutter_onnxruntime 的 CMake 只把 `libonnxruntime.so` 这个**符号链接**装进
      # bundle/lib，真文件（.so.1 / .so.1.22.0）留在 build 树里，靠插件 .so 里烘的
      # 绝对路径找到。在构建机上 ldd 因此全绿，换一台机器解包就是
      # `libonnxruntime.so.1: cannot open shared object file`——而 flutter_onnxruntime
      # 在 generated_plugin_registrant 里，这是**启动期**依赖，app 根本起不来。
      # 与 build-multiplatform.yml 给 fushi_server 随包 onnxruntime 的做法同源。
      - name: Bundle the real onnxruntime shared objects
        working-directory: fushi
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/linux/x64/release/bundle"
          src="$(dirname "$(find build/linux/x64/release/plugins/flutter_onnxruntime \
            -name 'libonnxruntime.so.1' -print -quit)")"
          test -n "$src"
          cp -av "$src"/libonnxruntime.so.1* "$bundle/lib/"
          # 插件 .so 的 RUNPATH 指向 build 树；那条路径在用户机器上不存在，且
          # DT_RUNPATH **不**参与传递依赖的继承查找，所以光把文件放进 bundle/lib
          # 还不够。改指 $ORIGIN——它自己就在 bundle/lib 里。
          patchelf --set-rpath '$ORIGIN' "$bundle/lib/libflutter_onnxruntime_plugin.so"
          readelf -d "$bundle/lib/libflutter_onnxruntime_plugin.so" | grep -E 'RPATH|RUNPATH|NEEDED.*onnx'

      # `libfushidicts_ffi.so` 缺席过一次，表现是构建全绿、查词在真机上
      # `DynamicLibrary.open` 失败（linux/CMakeLists.txt:77 的注释就是那次的记录）。
      # 上传前硬断言，别把一个查不了词的包发给用户。
      - name: Assert bundle shape
        working-directory: fushi
        shell: bash
        run: |
          set -euo pipefail
          bundle="build/linux/x64/release/bundle"
          test -x "$bundle/fushi"
          test -f "$bundle/lib/libfushidicts_ffi.so"
          test -d "$bundle/data/flutter_assets"
          # 悬空符号链接就是上面 onnxruntime 那个坑的通用形状：装了个名字，没装字节。
          dangling="$(find "$bundle" -xtype l -printf '%p -> %l\n')"
          if [ -n "$dangling" ]; then
            echo "::error title=Dangling symlink in bundle::$dangling"
            exit 1
          fi
          echo "::group::bundle 内容"
          find "$bundle" -maxdepth 2 -printf '%y %10s  %p\n' | sort -k3
          echo "::endgroup::"
          echo "::group::可执行文件的动态依赖"
          ldd "$bundle/fushi" || true
          echo "::endgroup::"

      # 直接 upload-artifact 会丢可执行位（zip 不带 POSIX 权限），下载下来的 `fushi`
      # 要用户自己 chmod。先打 tar 保住权限。
      - name: Package bundle
        working-directory: fushi
        run: |
          tar -czf "$RUNNER_TEMP/fushi-linux-x64.tar.gz" \
            -C build/linux/x64/release bundle

      # 上一版的 ldd 在构建机上是绿的，却漏了 onnxruntime——因为 build 树还在，烘死的
      # 绝对路径照样解析得开。要证明包能在**别的机器**上跑，就得先让那条路径失效：
      # 把 build 树的 plugins 挪走，再把 tar 解到别处 ldd。这是本 workflow 唯一能在
      # 构建机上做的、对「自包含」的真检验。
      - name: Prove the bundle resolves without the build tree
        shell: bash
        run: |
          set -euo pipefail
          mv fushi/build/linux/x64/release/plugins "$RUNNER_TEMP/plugins-moved"
          mkdir -p "$RUNNER_TEMP/relocated"
          tar -xzf "$RUNNER_TEMP/fushi-linux-x64.tar.gz" -C "$RUNNER_TEMP/relocated"
          report="$(ldd "$RUNNER_TEMP/relocated/bundle/fushi")"
          echo "::group::ldd do bundle relocado"
          echo "$report"
          echo "::endgroup::"
          missing="$(printf '%s\n' "$report" | grep 'not found' || true)"
          if [ -n "$missing" ]; then
            echo "::error title=Bundle not self-contained::$missing"
            exit 1
          fi
          # 反向锚：确认 onnxruntime 这次真是从 bundle/lib 解析的，而不是又从某个
          # 残留的 build 路径。断言拿不到就说明这条检验在空转。
          printf '%s\n' "$report" | grep -F "libonnxruntime.so.1 => $RUNNER_TEMP/relocated/bundle/lib/"

      - name: Upload Linux x64 bundle
        uses: actions/upload-artifact@v4
        with:
          name: fushi-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/fushi-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7
