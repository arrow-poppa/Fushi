name: Linux x64 artifact

on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: 'Run lookup and OCR checks without packaging Linux'
        type: boolean
        default: false
      flatpak_from_run:
        description: 'Actions run ID of a successful Linux x64 tarball build on this branch.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.validate_only && inputs.flatpak_from_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build Linux x64 release bundle
        env:
          FUSHI_DOCKER_CPUS: '3'
          FUSHI_DOCKER_MEMORY: 12g
        run: bash tool/linux/build_in_docker.sh

      - name: Upload Linux x64 bundle
        uses: actions/upload-artifact@v7
        with:
          name: fushi-linux-x64-${{ github.sha }}
          path: build/linux-dist/fushi-*-linux-x64.tar.gz
          if-no-files-found: error

  flatpak:
    if: ${{ !inputs.validate_only && inputs.flatpak_from_run != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check the source Linux bundle
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.flatpak_from_run }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")
          sha=$(jq -er --arg branch "$GITHUB_REF_NAME" --arg repo "$GITHUB_REPOSITORY" '
            select(.head_branch == $branch and .head_repository.full_name == $repo
              and .path == ".github/workflows/linux-x64-artifact.yml"
              and .conclusion == "success")
            | .head_sha
          ' <<< "$run")
          echo "name=fushi-linux-x64-$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          name: ${{ steps.source.outputs.name }}
          path: build/flatpak-input
          run-id: ${{ inputs.flatpak_from_run }}
          github-token: ${{ github.token }}

      - name: Build the Flatpak with WPE WebKit
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(build/flatpak-input/fushi-*-linux-x64.tar.gz)
          test "${#bundles[@]}" -eq 1
          bash tool/linux/flatpak/build_flatpak.sh "${bundles[0]}"

      - name: Verify WPE and the dictionary engine in the installed sandbox
        run: |
          set -euo pipefail
          docker run --rm -i --privileged \
            -v fushi-flatpak-state:/root/.local/share/flatpak \
            -v "$PWD/build/linux-dist:/out:ro" \
            fushi-flatpak-build bash -euo pipefail <<'CONTAINER'
          flatpak install --user --noninteractive --or-update --bundle /out/fushi-*.flatpak
          flatpak run --user --command=sh app.fushi.reader -es <<'APP'
          test -x /app/fushi/fushi
          test -f /app/fushi/lib/libfushidicts_ffi.so
          for binary in /app/fushi/fushi /app/fushi/lib/libflutter_inappwebview_linux_wpe.so; do
            report="$(ldd "$binary")"
            printf '%s\n' "$report"
            if printf '%s\n' "$report" | grep -q 'not found'; then exit 1; fi
          done
          printf '%s\n' "$report" | grep -E 'libWPEWebKit-2.0.so.1 => /app/lib/'
          APP
          CONTAINER

      - name: Upload the Flatpak
        uses: actions/upload-artifact@v7
        with:
          name: fushi-flatpak-x64-${{ github.sha }}
          path: build/linux-dist/fushi-*.flatpak
          compression-level: 0
          if-no-files-found: error

  popup:
    if: ${{ inputs.flatpak_from_run == '' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the AI explanation popup
        working-directory: test/js
        run: |
          npm install --ignore-scripts
          node --test popup_ai_explanation.test.mjs

  lookup-and-ocr:
    if: ${{ inputs.flatpak_from_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
      - uses: ./.github/actions/fetch-vendored-binaries
        with:
          groups: android
      - name: Resolve Flutter dependencies
        working-directory: fushi
        run: flutter pub get
      - name: Apply pub cache patches
        run: bash ci/apply-patches.sh
      - uses: ./.github/actions/gen-i18n
      - name: Check app and fork integration
        working-directory: fushi
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - uses: ./.github/actions/setup-fushi-compute
      - name: Test lookup, PP-OCR and AI Explanation
        working-directory: fushi
        run: >-
          flutter test --no-pub
          test/lookup/hyphenated_compound_lookup_test.dart
          test/media/music/lyrics/music_lyrics_page_logic_test.dart
          test/utils/components/content_language_engine_coverage_test.dart
          test/lookup/ocr_block_sentence_test.dart
          test/ocr/ppocr_script_traits_test.dart
          test/floating_ball/screen_ocr_lens_test.dart
          test/floating_ball/screen_ocr_local_test.dart
          test/media/manga/ocr/google_lens_protocol_test.dart
          test/ai/ai_explanation_controller_test.dart
          test/ai/ai_explanation_repository_test.dart
